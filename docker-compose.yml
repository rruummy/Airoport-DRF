services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: airport_drf
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: always

  web:
    build: .
    working_dir: /app/airport
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  celery:
    build: .
    working_dir: /app/airport
    command: celery -A airport worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis
      - db

  celery-beat:
    build: .
    working_dir: /app/airport
    command: celery -A airport beat --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis
      - db